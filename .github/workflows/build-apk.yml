name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"

          JAVA_VER_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER_STR"

          if [ -z "$JAVA_VER_STR" ]; then
            echo "::error::Failed to detect Java version."
            exit 1
          fi

          JAVA_MAJOR=$(echo "$JAVA_VER_STR" | cut -d'.' -f1)
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(echo "$JAVA_VER_STR" | cut -d'.' -f2)
          fi
          echo "Detected Java major version: $JAVA_MAJOR"

          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version as an integer: $JAVA_MAJOR"
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version must be 17 or newer. Detected major version: $JAVA_MAJOR"
            exit 1
          fi

          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore detected."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "::error::Expected debug APK not found at $TARGET_APK"
            echo "Listing files found in app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "::error::Generated APK at $TARGET_APK is empty (0 bytes)."
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) echo "Verified extension: .apk" ;;
            *) echo "::error::$TARGET_APK does not have .apk extension" ; exit 1 ;;
          esac

          echo "APK successfully verified at $TARGET_APK ($(du -h "$TARGET_APK" | cut -f1))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_ASSET_DIR=$(mktemp -d)
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TARGET_FILE="$RELEASE_ASSET_DIR/app-debug.apk"

          cp "$SOURCE_APK" "$TARGET_FILE"

          if [ ! -f "$TARGET_FILE" ] || [ ! -s "$TARGET_FILE" ]; then
            echo "::error::Failed to prepare release asset at $TARGET_FILE"
            exit 1
          fi

          echo "Prepared release asset at: $TARGET_FILE"
          echo "asset_path=$TARGET_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset file missing or empty at $ASSET_PATH"
            exit 1
          fi

          ASSET_FILENAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_FILENAME" != "app-debug.apk" ]; then
            echo "::error::Asset filename must be app-debug.apk, but got $ASSET_FILENAME"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.

          - GitHub Actions Run Number: ${{ github.run_number }}
          - GitHub Actions Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}

          Important Notice:
          - This APK is intended for testing purposes only.
          - This APK is not a Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

          echo "GitHub Release $TAG_NAME created successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

            echo "=== RELEASE PUBLISHED SUCCESSFULLY ==="
            gh release view "$TAG_NAME" || true
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page: https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
            echo "APK Filename: app-debug.apk"
            echo "Direct URL: $DIRECT_URL"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## DIRECT APK DOWNLOAD
          🚀 **Download URL:** [$DIRECT_URL]($DIRECT_URL)

          - **Release Tag:** \`$TAG_NAME\`
          - **Release Title:** $RELEASE_TITLE
          - **Asset Name:** \`app-debug.apk\`

          > **Note:** The GitHub Actions artifact named \`app-debug-apk\` remains available as a backup.
          EOF
          else
            echo "::warning::GitHub Release creation did not complete successfully or was skipped."
            echo "APK build succeeded and the backup Actions artifact 'app-debug-apk' remains available."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## APK BUILD COMPLETED (RELEASE BACKUP)
          ⚠️ GitHub Release publishing did not complete.
          The backup Actions artifact **\`app-debug-apk\`** was generated successfully and can be downloaded from the Summary artifacts section of this workflow run.
          EOF
          fi
